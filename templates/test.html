<!DOCTYPE html>
<html>

<head>
    <title>NG Bot - Direct Test</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }

        .data {
            background: #111;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #0f0;
        }

        .value {
            color: #ff0;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>NG MINI BOT - DIRECT STATE TEST</h1>
    <p>Time: <span id="time"></span></p>

    <div class="data">
        <div>Market Price: <span class="value" id="price">Loading...</span></div>
        <div>ATM Strike: <span class="value" id="atm">Loading...</span></div>
        <div>Expiry: <span class="value" id="expiry">Loading...</span></div>
        <div>Trend: <span class="value" id="trend">Loading...</span></div>
    </div>

    <div class="data">
        <h3>Raw State Data:</h3>
        <pre id="raw"></pre>
    </div>

    <script>
        function updateData() {
            document.getElementById('time').textContent = new Date().toLocaleTimeString();

            fetch('/api/state?' + new Date().getTime()) // Cache buster
                .then(r => r.json())
                .then(data => {
                    document.getElementById('price').textContent = data.market_price || '0.0';
                    document.getElementById('atm').textContent = data.atm_strike || '0';
                    document.getElementById('expiry').textContent = data.expiry || '-';
                    document.getElementById('trend').textContent = data.trend || 'NEUTRAL';
                    document.getElementById('raw').textContent = JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    document.getElementById('raw').textContent = 'ERROR: ' + err;
                });
        }

        // Update every 2 seconds
        setInterval(updateData, 2000);
        updateData();
    </script>
</body>

</html>
