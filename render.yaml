services:
  - type: web
    name: ng-automation-bot
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_SECRET_ID
        sync: false
      - key: FYERS_REDIRECT_URI
        sync: false
      - key: FYERS_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: 5055
      - key: ON_DEMAND_MODE
        value: "true"
    plan: free
